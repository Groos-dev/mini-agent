[package]
name = "agent-core"
version = "0.1.0"
edition = "2024"

[dependencies]
provider = { path = "../provider" }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
