[package]
name = "agent-core"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-protocol = { path = "../agent-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "process", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
