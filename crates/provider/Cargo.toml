[package]
name = "provider"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = {version = "1", features = ["derive"]}
serde_json = "1"
reqwest = {version = "0.12", features = ["json", "stream"]}
async-trait = "0.1"
thiserror = "2"
futures = "0.3"
async-stream = "0.3"
tracing = "0.1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
